<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Heading outline comparison</title>
</head>
<body style="margin:0">
  <!--
    Comparison figure: broken vs. correct heading outline.
    Referenced by an <img> element whose alt text describes the difference.
  -->
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Broken heading outline compared with a correct heading outline">
    <rect width="1000" height="360" fill="#f8fafc" />

    <!-- ===== LEFT: broken ===== -->
    <rect x="20" y="20" width="460" height="320" rx="16" fill="#fff" stroke="#f87171" stroke-width="3" />
    <rect x="20" y="20" width="460" height="44" rx="16" fill="#fee2e2" />
    <text x="40" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#991b1b">Broken outline</text>

    <g font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
      <rect x="44" y="86"  width="392" height="30" rx="6" fill="#e2e8f0" />
      <text x="56" y="107" font-size="15" font-weight="700">H1 · Article title</text>

      <rect x="44" y="136" width="392" height="30" rx="6" fill="#e2e8f0" />
      <text x="56" y="157" font-size="15" font-weight="700">H2 · Start with semantics</text>

      <!-- skip: h2 -> h4 -->
      <rect x="44" y="186" width="300" height="30" rx="6" fill="#fecaca" />
      <text x="56" y="207" font-size="15" font-weight="700" fill="#991b1b">H4 · Landmarks first</text>
      <path d="M366 186 l16 0 M374 178 l12 8 l-12 8" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="44" y="236" width="250" height="30" rx="6" fill="#fecaca" />
      <text x="56" y="257" font-size="15" font-weight="700" fill="#991b1b">H4 · One h1, then…</text>

      <rect x="44" y="286" width="200" height="30" rx="6" fill="#e2e8f0" />
      <text x="56" y="307" font-size="15" font-weight="700">H3 · Back down again</text>
    </g>

    <!-- ===== RIGHT: correct ===== -->
    <rect x="520" y="20" width="460" height="320" rx="16" fill="#fff" stroke="#34d399" stroke-width="3" />
    <rect x="520" y="20" width="460" height="44" rx="16" fill="#d1fae5" />
    <text x="540" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#065f46">Correct outline</text>

    <g font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
      <rect x="544" y="86"  width="392" height="30" rx="6" fill="#d1fae5" />
      <text x="556" y="107" font-size="15" font-weight="700">H1 · Article title</text>

      <rect x="544" y="126" width="392" height="30" rx="6" fill="#d1fae5" />
      <text x="556" y="147" font-size="15" font-weight="700">H2 · Start with semantics</text>

      <rect x="566" y="166" width="370" height="28" rx="6" fill="#d1fae5" />
      <text x="578" y="186" font-size="15" font-weight="700">H3 · Landmarks first</text>

      <rect x="566" y="204" width="370" height="28" rx="6" fill="#d1fae5" />
      <text x="578" y="224" font-size="15" font-weight="700">H3 · One h1, then…</text>

      <rect x="544" y="242" width="392" height="30" rx="6" fill="#d1fae5" />
      <text x="556" y="263" font-size="15" font-weight="700">H2 · Keyboard is a feature</text>

      <rect x="566" y="282" width="370" height="28" rx="6" fill="#d1fae5" />
      <text x="578" y="302" font-size="15" font-weight="700">H3 · Managing focus</text>
    </g>
  </svg>
</body>
</html>
