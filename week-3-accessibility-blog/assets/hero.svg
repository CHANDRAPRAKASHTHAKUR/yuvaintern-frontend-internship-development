<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero illustration</title>
</head>
<body style="margin:0">
  <!-- Decorative supporting graphic for the article hero.
       Referenced by an <img> with descriptive alt text in index.html. -->
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="A webpage read by three assistive technologies">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#eff6ff" />
        <stop offset="1" stop-color="#e0e7ff" />
      </linearGradient>
      <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" />
        <stop offset="1" stop-color="#f8fafc" />
      </linearGradient>
    </defs>

    <rect width="1200" height="520" fill="url(#bg)" />
    <circle cx="1050" cy="90" r="180" fill="#bfdbfe" opacity=".55" />
    <circle cx="150" cy="450" r="150" fill="#ddd6fe" opacity=".45" />

    <!-- The webpage being read -->
    <g transform="translate(430 60)">
      <rect x="0" y="0" width="340" height="400" rx="18" fill="url(#screen)" stroke="#94a3b8" stroke-width="3" />
      <rect x="0" y="0" width="340" height="46" rx="18" fill="#1d4ed8" />
      <rect x="18" y="18" width="120" height="10" rx="5" fill="#bfdbfe" />
      <rect x="24" y="70" width="292" height="20" rx="6" fill="#1e293b" />
      <rect x="24" y="104" width="230" height="12" rx="6" fill="#64748b" />
      <rect x="24" y="126" width="270" height="12" rx="6" fill="#64748b" />
      <rect x="24" y="164" width="292" height="72" rx="10" fill="#eff6ff" />
      <rect x="40" y="184" width="180" height="10" rx="5" fill="#1d4ed8" />
      <rect x="40" y="204" width="240" height="10" rx="5" fill="#94a3b8" />
      <rect x="24" y="252" width="140" height="12" rx="6" fill="#1e293b" />
      <rect x="24" y="278" width="292" height="10" rx="6" fill="#94a3b8" />
      <rect x="24" y="300" width="240" height="10" rx="6" fill="#94a3b8" />
      <rect x="24" y="344" width="120" height="34" rx="17" fill="#1d4ed8" />
    </g>

    <!-- Connector lines -->
    <g stroke="#1d4ed8" stroke-width="3" stroke-dasharray="8 8" fill="none" opacity=".7">
      <path d="M430 150 H250" />
      <path d="M430 260 H250" />
      <path d="M770 260 H950" />
    </g>

    <!-- 1. Screen reader -->
    <g transform="translate(40 90)">
      <rect x="0" y="0" width="210" height="120" rx="16" fill="#0f172a" />
      <circle cx="42" cy="46" r="20" fill="#38bdf8" />
      <path d="M34 46h16M42 38v16" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
      <rect x="76" y="34" width="110" height="10" rx="5" fill="#e2e8f0" />
      <rect x="76" y="56" width="76" height="10" rx="5" fill="#94a3b8" />
      <rect x="28" y="88" width="150" height="10" rx="5" fill="#38bdf8" />
    </g>

    <!-- 2. Magnifier / zoom -->
    <g transform="translate(50 300)">
      <circle cx="70" cy="70" r="60" fill="#ffffff" stroke="#1d4ed8" stroke-width="8" />
      <rect x="112" y="112" width="66" height="18" rx="9" transform="rotate(45 112 112)" fill="#1d4ed8" />
      <rect x="40" y="54" width="60" height="9" rx="4" fill="#0f172a" />
      <rect x="40" y="72" width="44" height="9" rx="4" fill="#64748b" />
    </g>

    <!-- 3. Switch device -->
    <g transform="translate(950 200)">
      <rect x="0" y="0" width="210" height="140" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="3" />
      <rect x="24" y="26" width="162" height="30" rx="8" fill="#e0e7ff" />
      <circle cx="60" cy="94" r="22" fill="#1d4ed8" />
      <circle cx="150" cy="94" r="22" fill="#cbd5f5" />
    </g>

    <!-- Caption strip -->
    <rect x="430" y="470" width="340" height="12" rx="6" fill="#94a3b8" opacity=".6" />
  </svg>
</body>
</html>
